[project]
name = "awq-two-param-scaling"
version = "0.1.0"
description = "AWQ-style activation-aware weight quantization (simulated) with a weight-aware second scaling exponent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "datasets", "accelerate"]

[project.scripts]
awq-lite = "awq_lite.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awq_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
